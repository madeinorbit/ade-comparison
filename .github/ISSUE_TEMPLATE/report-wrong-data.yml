name: Report wrong data
description: Correct an adecomparison.com finding with a public source and its exact sentence.
title: "Data correction: "
body:
  - type: markdown
    attributes:
      value: |
        Anyone can report wrong data. Include the product, what is wrong, a public source URL and the exact sentence that supports your correction.
        Word of mouth and private messages are not evidence. Vendors get no exception, including Podium.
        Maintainers verify the source in the research catalog (`research/`), then regenerate the public data package. Submitting an issue does not change the site automatically.
  - type: input
    id: product
    attributes:
      label: Product
      description: Name the ADE whose data needs correcting.
      placeholder: Product name
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What is wrong?
      description: Identify the current answer and the correction you propose. Include the plan, version or surface if it matters.
      placeholder: Which finding or filter is wrong, and what should it say?
    validations:
      required: true
  - type: input
    id: public_url
    attributes:
      label: Public source URL
      description: Link to a public page that supports the correction, such as documentation, a repository or a release announcement.
      placeholder: https://example.com/docs/feature
    validations:
      required: true
  - type: textarea
    id: exact_sentence
    attributes:
      label: Exact sentence from that source
      description: Copy the supporting sentence verbatim from the linked page. An adecomparison.com finding may be a summary, so quote the source itself.
      placeholder: Paste the exact source sentence here.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: adecomparison.com page or receipt
      description: The site prefills this when you open the form from a page or receipt. Add a section name if helpful.
    validations:
      required: false
  - type: checkboxes
    id: evidence_check
    attributes:
      label: Evidence check
      options:
        - label: My source is public and supports this correction, and I copied its exact sentence.
          required: true
