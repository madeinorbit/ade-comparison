name: Suggest a missing ADE
description: Propose an ADE for the directory with a public source and its exact sentence.
title: "Missing ADE: "
body:
  - type: markdown
    attributes:
      value: |
        Anyone can suggest a missing ADE. Name the product and explain what is missing, with a public source URL and the exact sentence that describes it.
        Word of mouth and private messages are not evidence. Vendors get no exception, including Podium.
        Maintainers check the product in the private catalog before regenerating the public export. A directory listing does not establish capability claims.
  - type: input
    id: product
    attributes:
      label: Missing product
      description: Name the ADE you want added, even if you opened this form from another product's page.
      placeholder: Product name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Product website or repository
      description: Link to the product's public home page or official repository.
      placeholder: https://example.com
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: What is missing?
      description: Describe the ADE and why it belongs in this directory. Include any relevant product rename or existing listing.
      placeholder: What does this product let people do with coding agents?
    validations:
      required: true
  - type: input
    id: public_url
    attributes:
      label: Public source URL
      description: Link to a public page describing the ADE. This can be the product website if it contains the sentence below.
      placeholder: https://example.com/docs
    validations:
      required: true
  - type: textarea
    id: exact_sentence
    attributes:
      label: Exact sentence from that source
      description: Copy the sentence that supports adding this ADE, verbatim from the linked page.
      placeholder: Paste the exact source sentence here.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: ade-comparison.com page or receipt
      description: The site prefills where you opened this form. This may name another product; it is not the ADE you are suggesting.
    validations:
      required: false
  - type: checkboxes
    id: evidence_check
    attributes:
      label: Evidence check
      options:
        - label: My source is public and supports this suggestion, and I copied its exact sentence.
          required: true
