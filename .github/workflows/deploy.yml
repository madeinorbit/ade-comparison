# Deploys https://adecomparison.com from main: catalog checks, build, unit tests, wrangler
# deploy, then a smoke check that compares the live pages with the build. A manual run on
# another branch checks, builds, tests and dry-runs only, without secrets. Account setup: README "Deploy".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Opens the correction and ADE suggestion forms (config.mjs). Unset, the forms stay hidden.
      ADE_COMPARISON_PUBLIC_REPOSITORY_URL: https://github.com/madeinorbit/ade-comparison
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm run research:validate
      - run: npm run test:research
      - run: npm run build
      - run: npm test
      - run: npx wrangler deploy --dry-run

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Opens the correction and ADE suggestion forms (config.mjs). Unset, the forms stay hidden.
      ADE_COMPARISON_PUBLIC_REPOSITORY_URL: https://github.com/madeinorbit/ade-comparison
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm run research:validate
      - run: npm run test:research
      - run: npm run build
      - run: npm test
      # The token is only exposed to this step, not to npm ci or the build.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/smoke-production.mjs ${{ vars.SITE_URL }}
