# Checks every pull request: catalog checks (public package rebuild, research validation and
# research tests), data validation and build, unit tests, then the Playwright browser
# tests against the built site. Deploys happen only from main (deploy.yml).
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # Opens the correction and ADE suggestion forms (config.mjs). Unset, the forms stay hidden.
      ADE_COMPARISON_PUBLIC_REPOSITORY_URL: https://github.com/madeinorbit/ade-comparison
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:check
      - run: npm run research:validate
      - run: npm run test:research
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 3
